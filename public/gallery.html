<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería del Evento</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 100%);
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            text-align: center;
            margin-bottom: 40px;
            font-size: 36px;
            letter-spacing: 2px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .photo-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .photo-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .photo-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }
        .photo-info {
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .photo-info h3 { color: #d4af37; font-size: 18px; margin-bottom: 5px; font-family: 'Playfair Display', serif; }
        .photo-info p { color: #888; font-size: 13px; font-weight: 300; }
        .no-photos {
            text-align: center;
            color: #666;
            font-size: 20px;
            padding: 100px 20px;
            font-family: 'Playfair Display', serif;
        }
        .loading { text-align: center; color: #d4af37; font-size: 18px; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Galería del Evento</h1>
        <div id="gallery" class="gallery-grid">
            <div class="loading">Cargando recuerdos...</div>
        </div>
    </div>

    <script>
        async function cargarGaleria() {
            try {
                const response = await fetch('/api/galeria');
                const data = await response.json();
                const gallery = document.getElementById('gallery');
                
                if (!data.visible || data.fotos.length === 0) {
                    gallery.innerHTML = '<div class="no-photos">La galería aún no ha sido habilitada<br>o no hay fotos para mostrar.</div>';
                    return;
                }

                gallery.innerHTML = data.fotos.map(foto => `
                    <div class="photo-card">
                        <img src="${foto.imagen_url}" alt="Foto" loading="lazy">
                        <div class="photo-info">
                            <h3>${foto.invitado_nombre}</h3>
                            <p>${new Date(foto.fecha_creacion).toLocaleString('es-ES', { day: 'numeric', month: 'long', hour: '2-digit', minute:'2-digit' })}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('gallery').innerHTML = '<div class="no-photos">Error cargando la galería</div>';
            }
        }
        cargarGaleria();
        setInterval(cargarGaleria, 15000);
    </script>
</body>
</html>
