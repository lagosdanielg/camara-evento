<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería del Evento</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 100%);
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        @media (min-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
            h1 { font-size: 36px; margin-bottom: 40px; }
        }
        .photo-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        .photo-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .photo-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
        }
        .photo-info {
            padding: 15px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .photo-info h3 { color: #d4af37; font-size: 16px; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .photo-info p { color: #888; font-size: 12px; font-weight: 300; }
        .no-photos {
            text-align: center;
            color: #666;
            font-size: 18px;
            padding: 80px 20px;
            font-family: 'Playfair Display', serif;
        }
        .loading { text-align: center; color: #d4af37; font-size: 16px; padding: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Galería del Evento</h1>
        <div id="gallery" class="gallery-grid">
            <div class="loading">Cargando recuerdos...</div>
        </div>
    </div>

    <script>
        async function cargarGaleria() {
            try {
                // Agregamos ?t= para evitar que el navegador del celular guarde en caché la respuesta
                const response = await fetch('/api/galeria?t=' + Date.now());
                const data = await response.json();
                const gallery = document.getElementById('gallery');
                
                if (!data.visible || data.fotos.length === 0) {
                    gallery.innerHTML = '<div class="no-photos">La galería aún no ha sido habilitada<br>o no hay fotos para mostrar.</div>';
                    return;
                }

                gallery.innerHTML = data.fotos.map(foto => `
                    <div class="photo-card">
                        <img src="${foto.imagen}" alt="Foto" loading="lazy">
                        <div class="photo-info">
                            <h3>${foto.invitado_nombre}</h3>
                            <p>${new Date(foto.fecha_creacion).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' })}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('gallery').innerHTML = '<div class="no-photos">Error cargando la galería</div>';
            }
        }
        cargarGaleria();
        // Actualizar cada 10 segundos
        setInterval(cargarGaleria, 10000);
    </script>
</body>
</html>
