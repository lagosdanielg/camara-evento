<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cámara del Evento</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .header h2 { font-family: 'Playfair Display', serif; color: #d4af37; font-size: 18px; }
        
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 15px auto;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            /* Ajuste de tamaño inteligente para móviles */
            aspect-ratio: 3/4; 
            max-height: 65vh;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Hace que la imagen llene el espacio sin deformarse */
            display: block; 
        }
        canvas { display: none; }
        
        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 30px; 
            padding: 20px; 
            margin-top: auto; /* Empuja los controles hacia abajo */
        }
        .btn-control {
            background: transparent;
            border: 2px solid rgba(212, 175, 55, 0.5);
            color: #d4af37;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-control:active { transform: scale(0.9); background: rgba(212, 175, 55, 0.1); }
        
        .capture-btn {
            background: transparent;
            border: 3px solid #d4af37;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .capture-btn::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: #d4af37;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .capture-btn:active::after { transform: translate(-50%, -50%) scale(0.85); }
        .capture-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .gallery { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .gallery h3 {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            margin-bottom: 15px;
            text-align: center;
            font-size: 20px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .photo-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn {
            position: absolute;
            top: 4px; right: 4px;
            background: rgba(0,0,0,0.7);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.3);
            border-radius: 50%;
            width: 26px; height: 26px;
            cursor: pointer;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .no-photos { text-align: center; color: #666; padding: 30px; font-style: italic; font-size: 14px; }
        .flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 1000;
            animation: flash 0.3s;
        }
        @keyframes flash { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="header">
        <h2>📸 <span id="nombreUsuario">Invitado</span></h2>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button class="btn-control" onclick="toggleCamera()" title="Cambiar cámara">🔄</button>
        <button class="capture-btn" onclick="capturarFoto()"></button>
        <div style="width: 50px;"></div> <!-- Espaciador para centrar el botón de captura -->
    </div>

    <div class="gallery">
        <h3>Tus Capturas</h3>
        <div id="photoGrid" class="photo-grid">
            <div class="no-photos">Cargando...</div>
        </div>
    </div>

    <script>
        let invitado = null;
        let stream = null;
        let facingMode = 'environment'; // 'environment' = trasera, 'user' = frontal (selfie)

        const invitadoData = localStorage.getItem('invitado');
        if (!invitadoData) {
            window.location.href = '/';
        } else {
            invitado = JSON.parse(invitadoData);
            document.getElementById('nombreUsuario').textContent = invitado.nombre;
            iniciarCamara();
            cargarMisFotos();
        }

        async function iniciarCamara() {
            // Detener stream anterior si existe
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 960 }
                    } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                alert('Error al acceder a la cámara: ' + err.message);
            }
        }

        function toggleCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            iniciarCamara();
        }

        async function capturarFoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);

            const flash = document.createElement('div');
            flash.className = 'flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 300);

            const imagen = canvas.toDataURL('image/jpeg', 0.8);
            const btn = document.querySelector('.capture-btn');
            btn.disabled = true;

            try {
                const response = await fetch('/api/foto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ invitado_id: invitado._id, imagen: imagen })
                });
                const data = await response.json();
                if (data.success) cargarMisFotos();
                else alert('Error: ' + data.error);
            } catch (err) {
                alert('Error de conexión al guardar');
            } finally {
                btn.disabled = false;
            }
        }

        async function cargarMisFotos() {
            try {
                const response = await fetch(`/api/mis-fotos/${invitado._id}`);
                const data = await response.json();
                const grid = document.getElementById('photoGrid');
                
                if (!data.fotos || data.fotos.length === 0) {
                    grid.innerHTML = '<div class="no-photos">Aún no has tomado fotos</div>';
                    return;
                }

                grid.innerHTML = data.fotos.map(foto => `
                    <div class="photo-item">
                        <img src="${foto.imagen_url}" alt="Foto" loading="lazy">
                        <button class="delete-btn" onclick="eliminarFoto('${foto._id}')">×</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('photoGrid').innerHTML = '<div class="no-photos">Error al cargar</div>';
            }
        }

        async function eliminarFoto(fotoId) {
            if (!confirm('¿Eliminar esta foto?')) return;
            try {
                const response = await fetch(`/api/foto/${fotoId}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) cargarMisFotos();
            } catch (err) {
                alert('Error al eliminar');
            }
        }

        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
        });
    </script>
</body>
</html>
